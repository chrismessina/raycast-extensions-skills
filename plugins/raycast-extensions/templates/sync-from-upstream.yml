name: Sync from upstream

# TEMPLATE — canonical copy lives in raycast-extensions-skills:
#   plugins/raycast-extensions/templates/sync-from-upstream.yml
# Install it with scripts/setup-mirror.sh, not by copying a sibling mirror's copy:
# the script also sets the repo settings the workflow depends on. Fix bugs HERE,
# then re-run the script in each mirror.
#
# Reconciles a standalone mirror against the merged monorepo state, delivering
# the two things Raycast CI produces ONLY on merge (the stamped {PR_MERGE_DATE}
# and recompressed screenshots) plus any changes a contributor merged upstream.
#
# ── THE GUARANTEE, STATED EXACTLY ───────────────────────────────────────────
#
#   Extension CONTENT reaches main only through a pull request you merge, and
#   a file you changed locally is never overwritten. The ONE direct write to
#   main is bookkeeping: .github/upstream-sync-state.json (the baseline this
#   compare depends on), committed on the default branch when no PR will carry
#   it — see "Record the new baseline". No extension source moves in that
#   commit.
#
# Every guard below has a dated incident behind it, kept out of this file so the
# executable text stays readable:
#   plugins/raycast-extensions/learnings/workflow-issues/upstream-sync-workflow-incident-history.md
# Comments here say WHAT a guard holds; that learning says what broke without it.
#
# ── HOW IT DECIDES ──────────────────────────────────────────────────────────
#
# Three-way compare per file, against .github/upstream-sync-state.json (the
# upstream blob SHAs recorded at the last successful sync):
#
#   upstream changed?  mirror changed?  →  action
#   ─────────────────  ───────────────     ─────────────────────────────────
#   no                 no                  nothing
#   yes                no                  take upstream (stamp, PNGs, fixes)
#   no                 yes                 KEEP YOURS  ← the README case
#   yes                yes                 CONFLICT → open an issue, sync nothing
#   yes                yes                 … except CHANGELOG.md differing ONLY
#                                          by the {PR_MERGE_DATE} stamp → take
#                                          upstream (that stamp is the point)
#   yes                yes                 … except upstream's bytes are a version
#                                          this mirror already HAD → KEEP YOURS
#                                          (upstream is behind, not diverged)
#   yes                yes                 … except a 3-way merge against the
#                                          baseline has no overlapping hunks →
#                                          MERGE, delivered in the sync PR
#   package-lock.json  —                   NOT compared. Derived from
#                                          package.json; regenerated when
#                                          package.json is taken.
#   DELETED upstream   no                  propagate the deletion
#   DELETED upstream   yes                 KEEP YOURS (it becomes local-only)
#
# Row 4 is genuinely ambiguous and is never resolved by a script; its three
# exceptions do not resolve it, they show it was never ambiguous. "Upstream is
# behind" means upstream serves a version this mirror held after the last
# baseline. A clean merge combines both sides' edits without choosing between
# them, and still reaches main only through a PR you review. Overlapping hunks
# halt. The DELETED rows are computed from the baseline, not from the upstream
# listing — the listing only says what exists now.
#
# STAGGER THE CRON MINUTE per repo (setup-mirror.sh derives it from the repo
# name): GitHub queues same-minute schedules across all of Actions.

on:
  # The cron is the SAFETY NET, not the primary path: a merge-triggered sync
  # only fires for merges you know about, and someone else's PR to your
  # extension merging upstream is exactly when a mirror drifts unnoticed.
  schedule:
    - cron: "55 9 * * *"
  # Fired by `ship`'s post-merge step (or `gh workflow run`) for an immediate
  # sync after your own PR merges, instead of waiting up to 24h.
  repository_dispatch:
    types: [upstream-sync]
  workflow_dispatch:
    inputs:
      ext_dir:
        description: "Override monorepo directory name (extensions/<ext_dir>) if it differs from package.json name"
        required: false

# Set UPSTREAM_EXT_DIR in repo-level env vars to permanently override the
# monorepo directory name when it differs from the package.json name field.
# e.g. for chrismessina/raycast-reader: UPSTREAM_EXT_DIR = reader-mode
env:
  UPSTREAM_EXT_DIR: ""
  STATE_FILE: .github/upstream-sync-state.json

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read extension name from package.json
        id: meta
        run: |
          NAME=$(jq -r '.name' package.json)
          # dispatch payload > workflow input > env var > package.json name
          OVERRIDE="${{ github.event.client_payload.ext_name }}"
          if [ -z "$OVERRIDE" ]; then OVERRIDE="${{ inputs.ext_dir }}"; fi
          if [ -z "$OVERRIDE" ]; then OVERRIDE="${UPSTREAM_EXT_DIR}"; fi
          if [ -n "$OVERRIDE" ]; then NAME="$OVERRIDE"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream file list and compare
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXT_NAME="${{ steps.meta.outputs.name }}"
          REPO="raycast/extensions"

          # Resolve the extension's OWN subtree, then list it in ONE recursive
          # call. A per-directory contents walk trips secondary rate limits
          # against a repo the default GITHUB_TOKEN does not own (history: 2026-07-31).
          COMMIT=$(gh api "repos/${REPO}/commits?path=extensions/${EXT_NAME}&per_page=1" --jq '.[0].sha')
          [ -n "$COMMIT" ] || { echo "Could not resolve upstream commit"; exit 1; }
          ROOT_TREE=$(gh api "repos/${REPO}/commits/${COMMIT}" --jq '.commit.tree.sha')
          EXTS_TREE=$(gh api "repos/${REPO}/git/trees/${ROOT_TREE}" --jq '.tree[] | select(.path=="extensions") | .sha')
          EXT_TREE=$(gh api "repos/${REPO}/git/trees/${EXTS_TREE}" --jq ".tree[] | select(.path==\"${EXT_NAME}\") | .sha")
          [ -n "$EXT_TREE" ] || { echo "Extension ${EXT_NAME} not found upstream"; exit 1; }

          TREE_JSON=$(gh api "repos/${REPO}/git/trees/${EXT_TREE}?recursive=1")

          # A truncated tree silently OMITS entries, which would read as
          # "upstream no longer serves this file" and become deletions. The
          # whole-repo recursive call does truncate on this monorepo; the
          # subtree call is asserted rather than assumed. Fail closed.
          [ "$(jq -r '.truncated' <<<"$TREE_JSON")" = "false" ] || {
            echo "ABORT: upstream tree response was truncated; refusing to sync a partial file list."
            exit 1
          }

          # path -> upstream blob SHA. A git blob SHA is content-addressed, so
          # "changed" is exact.
          jq -r '.tree[] | select(.type=="blob") | "\(.path)\t\(.sha)"' <<<"$TREE_JSON" \
            | sort > "$RUNNER_TEMP/upstream.tsv"

          echo "upstream serves $(wc -l < "$RUNNER_TEMP/upstream.tsv" | tr -d ' ') files"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

          # Baseline: what upstream served at the LAST sync. Absent on first
          # run — then every upstream file is "new", and a mirror file that
          # differs is treated as locally-modified (conservative: we keep it).
          if [ -f "$STATE_FILE" ]; then
            jq -r '.files | to_entries[] | "\(.key)\t\(.value)"' "$STATE_FILE" | sort > "$RUNNER_TEMP/baseline.tsv"
            echo "baseline: $(wc -l < "$RUNNER_TEMP/baseline.tsv" | tr -d ' ') files from $(jq -r '.synced_at' "$STATE_FILE")"
          else
            : > "$RUNNER_TEMP/baseline.tsv"
            echo "baseline: none (first run — will not overwrite any differing local file)"
          fi

          : > "$RUNNER_TEMP/to-update.txt"
          : > "$RUNNER_TEMP/kept-local.txt"
          : > "$RUNNER_TEMP/conflicts.txt"
          : > "$RUNNER_TEMP/ignored.txt"
          : > "$RUNNER_TEMP/derived.txt"
          : > "$RUNNER_TEMP/stamped.txt"
          : > "$RUNNER_TEMP/behind.txt"
          : > "$RUNNER_TEMP/merged.txt"

          # True when upstream's bytes for path $1 (blob $2) are a version this
          # mirror held SINCE the baseline was recorded. Upstream is then BEHIND,
          # not diverged. Needs full history (fetch-depth: 0).
          #
          # Bounded to post-baseline commits on purpose: searching all history
          # would read an upstream REVERT as "behind" and keep it out silently.
          # Bounded, a revert lands on a pre-baseline blob and halts as a conflict.
          BASELINE_COMMIT=$(git log -1 --format=%H -- "$STATE_FILE" 2>/dev/null || true)
          upstream_is_behind() {
            local c
            [ -n "$BASELINE_COMMIT" ] || return 1
            while IFS= read -r c; do
              [ "$(git rev-parse -q --verify "$c:$1" 2>/dev/null)" = "$2" ] && return 0
            done < <(git rev-list "$BASELINE_COMMIT..HEAD" -- "$1")
            return 1
          }

          # 3-way merge of path $1: ours = the mirror's copy, base = baseline
          # blob $2, theirs = upstream blob $3. Succeeds only with zero
          # overlapping hunks, and for JSON only when the result still parses.
          # The result is staged under $RUNNER_TEMP/merged/ and written into the
          # tree by the download step, so it reaches main only through the sync
          # PR. Any fetch or hash failure returns 1 (CONFLICT): a network blip
          # halts the run instead of guessing. Both sides are fetched by blob
          # SHA, not by path — a raw URL breaks on a path with a space.
          try_merge() {
            local path=$1 base_sha=$2 up_sha=$3 d="$RUNNER_TEMP/merge"
            mkdir -p "$d"
            gh api "repos/${REPO}/git/blobs/${base_sha}" --jq .content | base64 -d > "$d/base" || return 1
            [ "$(git hash-object "$d/base")" = "$base_sha" ] || return 1
            gh api "repos/${REPO}/git/blobs/${up_sha}" --jq .content | base64 -d > "$d/up" || return 1
            [ "$(git hash-object "$d/up")" = "$up_sha" ] || return 1
            cp "$path" "$d/out"
            git merge-file -q "$d/out" "$d/base" "$d/up" || return 1
            case "$path" in *.json) jq empty "$d/out" >/dev/null 2>&1 || return 1 ;; esac
            mkdir -p "$RUNNER_TEMP/merged/$(dirname "$path")"
            cp "$d/out" "$RUNNER_TEMP/merged/$path"
          }

          while IFS=$'\t' read -r path up_sha; do
            # SKIP paths this mirror deliberately gitignores. `git add` refuses
            # an ignored path and exits non-zero, which would fail the whole run.
            #
            # `--no-index` is REQUIRED: by default `git check-ignore` consults
            # the index and reports a TRACKED file as not-ignored even when a
            # .gitignore rule matches it (a force-added file is exactly the case
            # this guard exists for). `--no-index` asks "does a rule match this
            # path?", which is the question meant. Skipping is the resolution,
            # not `git add -f`: the .gitignore is a deliberate exclusion.
            if git check-ignore -q --no-index -- "$path" 2>/dev/null; then
              printf '%s\n' "$path" >> "$RUNNER_TEMP/ignored.txt"
              continue
            fi

            # SKIP package-lock.json — DERIVED, not authored. A standalone mirror
            # carries devDependencies the monorepo copy does not, so its lock can
            # never equal upstream's while upstream's keeps moving under
            # dependency bots: a blob compare halts on it forever. Taking
            # upstream's lock would drop the mirror's devDependencies and break
            # `npm ci`. It is regenerated from package.json instead (relock step).
            if [ "$path" = "package-lock.json" ]; then
              printf '%s\n' "$path" >> "$RUNNER_TEMP/derived.txt"
              continue
            fi

            base_sha=$(awk -F'\t' -v p="$path" '$1==p{print $2}' "$RUNNER_TEMP/baseline.tsv")
            # git hash-object gives the blob SHA of OUR copy, directly
            # comparable to upstream's. Missing file -> empty.
            mine_sha=""
            [ -f "$path" ] && mine_sha=$(git hash-object "$path")

            if [ "$up_sha" = "$mine_sha" ]; then
              continue                                    # identical, nothing to do
            fi

            upstream_moved=true
            mirror_moved=true
            [ -n "$base_sha" ] && [ "$base_sha" = "$up_sha" ]   && upstream_moved=false
            [ -n "$base_sha" ] && [ "$base_sha" = "$mine_sha" ] && mirror_moved=false

            if [ -z "$base_sha" ]; then
              # No baseline for this path. If we have no copy at all it is
              # simply new; if we DO have a differing copy, we cannot prove who
              # changed it, so keep ours (fail safe toward local work).
              if [ -z "$mine_sha" ]; then
                printf '%s\t%s\n' "$path" "$up_sha" >> "$RUNNER_TEMP/to-update.txt"
              else
                printf '%s\n' "$path" >> "$RUNNER_TEMP/kept-local.txt"
              fi
            elif [ "$upstream_moved" = true ] && [ "$mirror_moved" = true ]; then
              # AUTO-RESOLVE the {PR_MERGE_DATE} stamp before calling it a
              # conflict: we wrote the placeholder, Raycast CI substituted the
              # date, so upstream's copy is OUR text with the date filled in.
              #
              # The test is line-wise and EXACT, not a date mask (a mask lets two
              # sides editing the same OLD release date compare equal). A line may
              # differ only if OUR line carries the placeholder and upstream's is
              # that same line with a date in its place; every other line must
              # match byte for byte, and the line counts must agree.
              if [ "$path" = "CHANGELOG.md" ] && grep -q '{PR_MERGE_DATE}' "$path"; then
                # The fetch is split out of the `if` chain so a failed download
                # is reported as such, not mistaken for "not a stamp". Falling
                # through to CONFLICT is still the safe outcome.
                if curl -fsSL --retry 3 --retry-delay 2 \
                     "https://raw.githubusercontent.com/${REPO}/${COMMIT}/extensions/${EXT_NAME}/${path}" \
                     -o "$RUNNER_TEMP/upstream-changelog"; then
                  if awk '
                    NR==FNR { mine[FNR]=$0; n=FNR; next }
                    FNR > n { exit 1 }
                    {
                      if ($0 == mine[FNR]) next
                      if (mine[FNR] !~ /\{PR_MERGE_DATE\}/) exit 1
                      stamped = $0
                      gsub(/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/, "{PR_MERGE_DATE}", stamped)
                      if (stamped != mine[FNR]) exit 1
                    }
                    END { if (FNR != n) exit 1 }
                  ' "$path" "$RUNNER_TEMP/upstream-changelog"; then
                    printf '%s\t%s\n' "$path" "$up_sha" >> "$RUNNER_TEMP/to-update.txt"
                    printf '%s\n' "$path" >> "$RUNNER_TEMP/stamped.txt"
                    continue
                  fi
                else
                  echo "  WARNING: could not fetch upstream CHANGELOG.md to test for the {PR_MERGE_DATE} stamp; treating as a conflict."
                fi
              fi
              if upstream_is_behind "$path" "$up_sha"; then
                printf '%s\n' "$path" >> "$RUNNER_TEMP/kept-local.txt"
                printf '%s\n' "$path" >> "$RUNNER_TEMP/behind.txt"
                continue
              fi
              if try_merge "$path" "$base_sha" "$up_sha"; then
                printf '%s\n' "$path" >> "$RUNNER_TEMP/merged.txt"
                continue
              fi
              printf '%s\n' "$path" >> "$RUNNER_TEMP/conflicts.txt"
            elif [ "$upstream_moved" = true ]; then
              printf '%s\t%s\n' "$path" "$up_sha" >> "$RUNNER_TEMP/to-update.txt"
            else
              printf '%s\n' "$path" >> "$RUNNER_TEMP/kept-local.txt"
            fi
          done < "$RUNNER_TEMP/upstream.tsv"

          # -- UPSTREAM DELETIONS ------------------------------------------
          #
          # The loop above only visits paths upstream serves NOW. A path in the
          # baseline and absent from upstream.tsv is an unambiguous upstream
          # deletion; the baseline only ever holds paths upstream served, so a
          # local-only file (AGENTS.md, CLAUDE.md, .github/) can never become a
          # deletion candidate.
          : > "$RUNNER_TEMP/to-delete.txt"
          : > "$RUNNER_TEMP/deleted-upstream-kept.txt"

          while IFS=$'\t' read -r path base_sha; do
            [ -n "$path" ] || continue
            # Still served upstream? Then it was not deleted.
            awk -F'\t' -v p="$path" '$1==p{f=1} END{exit !f}' "$RUNNER_TEMP/upstream.tsv" && continue
            # Derived, never compared — and so never deleted either.
            [ "$path" = "package-lock.json" ] && continue
            # Gitignored here, already gone, or never tracked: nothing to do.
            git check-ignore -q --no-index -- "$path" 2>/dev/null && continue
            [ -f "$path" ] || continue
            git ls-files --error-unmatch -- "$path" >/dev/null 2>&1 || continue

            if [ "$(git hash-object "$path")" = "$base_sha" ]; then
              printf '%s\n' "$path" >> "$RUNNER_TEMP/to-delete.txt"
            else
              # Upstream dropped it AND we changed it. Ambiguous; the fail-safe
              # direction is row 3: keep ours. It becomes a local-only file.
              printf '%s\n' "$path" >> "$RUNNER_TEMP/deleted-upstream-kept.txt"
            fi
          done < "$RUNNER_TEMP/baseline.tsv"

          # Refuse a mass deletion unattended: a legitimate upstream restructure
          # and a resolution bug pointing at the wrong subtree look identical here.
          DEL=$(wc -l < "$RUNNER_TEMP/to-delete.txt" | tr -d ' ')
          BASE_N=$(wc -l < "$RUNNER_TEMP/baseline.tsv" | tr -d ' ')
          if [ "$DEL" -gt 0 ] && [ "$BASE_N" -gt 0 ] && [ $((DEL * 2)) -gt "$BASE_N" ]; then
            echo "ABORT: $DEL of $BASE_N baseline files vanished upstream — refusing to propagate a deletion that large."
            exit 1
          fi

          UPD=$(wc -l < "$RUNNER_TEMP/to-update.txt" | tr -d ' ')
          KEPT=$(wc -l < "$RUNNER_TEMP/kept-local.txt" | tr -d ' ')
          CONF=$(wc -l < "$RUNNER_TEMP/conflicts.txt" | tr -d ' ')
          IGN=$(wc -l < "$RUNNER_TEMP/ignored.txt" | tr -d ' ')
          DELKEPT=$(wc -l < "$RUNNER_TEMP/deleted-upstream-kept.txt" | tr -d ' ')
          MERGED=$(wc -l < "$RUNNER_TEMP/merged.txt" | tr -d ' ')
          echo "take-upstream=$UPD  merged=$MERGED  delete=$DEL  keep-local=$KEPT  conflicts=$CONF  gitignored=$IGN"
          # Say what was dropped. A silent skip reads as "covered everything".
          if [ "$IGN" -gt 0 ]; then echo "skipped (gitignored by this mirror):"; sed 's/^/    /' "$RUNNER_TEMP/ignored.txt"; fi
          if [ -s "$RUNNER_TEMP/derived.txt" ]; then echo "skipped (derived, regenerated locally):"; sed 's/^/    /' "$RUNNER_TEMP/derived.txt"; fi
          if [ -s "$RUNNER_TEMP/stamped.txt" ]; then echo "auto-resolved ({PR_MERGE_DATE} stamped upstream):"; sed 's/^/    /' "$RUNNER_TEMP/stamped.txt"; fi
          if [ "$KEPT" -gt 0 ]; then echo "kept (local-only edits, NOT reverted):"; sed 's/^/    /' "$RUNNER_TEMP/kept-local.txt"; fi
          if [ -s "$RUNNER_TEMP/behind.txt" ]; then echo "  of which upstream is BEHIND (serves a version this mirror already had):"; sed 's/^/    /' "$RUNNER_TEMP/behind.txt"; fi
          if [ "$MERGED" -gt 0 ]; then echo "merged (both sides changed, no overlapping hunks):"; sed 's/^/    /' "$RUNNER_TEMP/merged.txt"; fi
          if [ "$CONF" -gt 0 ]; then echo "CONFLICTS (both sides changed):";        sed 's/^/    /' "$RUNNER_TEMP/conflicts.txt"; fi
          if [ "$DEL" -gt 0 ]; then echo "removed (upstream no longer serves):";     sed 's/^/    /' "$RUNNER_TEMP/to-delete.txt"; fi
          if [ "$DELKEPT" -gt 0 ]; then echo "kept (upstream removed, changed here):"; sed 's/^/    /' "$RUNNER_TEMP/deleted-upstream-kept.txt"; fi

          # `updated` gates every write step, so it counts merged files too;
          # `taken` and `merged` keep them apart for the PR body.
          {
            echo "updated=$((UPD + MERGED))"
            echo "taken=$UPD"
            echo "merged=$MERGED"
            echo "deleted=$DEL"
            echo "kept=$KEPT"
            echo "conflicts=$CONF"
          } >> "$GITHUB_OUTPUT"

      - name: Open an issue and stop, if any file changed on BOTH sides
        if: steps.compare.outputs.conflicts != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A file edited upstream AND locally cannot be reconciled by a script
          # without choosing whose work to discard. Sync NOTHING this run and
          # hand it to a human — a partial sync would be the confusing outcome.
          BODY=$(printf 'The upstream sync found files changed **both** upstream and in this mirror. It synced nothing, so no work was lost.\n\nConflicting files:\n\n%s\n\nUpstream commit: `%s`\n\nResolve by reconciling each file by hand, then re-run the workflow.\n' \
            "$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt")" \
            "${{ steps.compare.outputs.commit }}")

          # Reuse the open issue rather than filing a new one every cron tick.
          EXISTING=$(gh issue list --label upstream-sync --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create upstream-sync --color d93f0b --description "Upstream mirror sync" 2>/dev/null || true
            gh issue create --title "Upstream sync conflict — manual reconcile needed" \
              --label upstream-sync --body "$BODY"
          fi
          echo "::error::Sync halted: $(tr '\n' ' ' < "$RUNNER_TEMP/conflicts.txt")"
          exit 1

      - name: Download the files upstream actually changed
        if: steps.compare.outputs.updated != '0'
        shell: bash
        run: |
          set -euo pipefail
          EXT_NAME="${{ steps.meta.outputs.name }}"
          COMMIT="${{ steps.compare.outputs.commit }}"

          # Pinned to the resolved commit so every file comes from ONE
          # consistent snapshot, and from raw.githubusercontent (no API quota).
          while IFS=$'\t' read -r path sha; do
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/raycast/extensions/${COMMIT}/extensions/${EXT_NAME}/${path}" \
              -o "$path" || { echo "ABORT: failed to download $path"; exit 1; }

            # Verify we got the bytes upstream advertised. A truncated or
            # error-page response would otherwise be committed as content.
            GOT=$(git hash-object "$path")
            [ "$GOT" = "$sha" ] || { echo "ABORT: $path hash mismatch (want $sha, got $GOT)"; exit 1; }
            echo "  updated: $path"
          done < "$RUNNER_TEMP/to-update.txt"

          # Merged files were built and checked in the compare step; place them.
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            cp "$RUNNER_TEMP/merged/$path" "$path"
            echo "  merged: $path"
          done < "$RUNNER_TEMP/merged.txt"

      # The lock is excluded from the three-way compare, so it is brought back
      # into agreement with package.json here — and ONLY when package.json
      # actually moved. `npm install --package-lock-only` re-resolves from
      # package.json without touching node_modules or running install scripts:
      # it keeps this mirror's own devDependencies AND picks up what upstream bumped.
      - name: Regenerate package-lock.json when package.json changed
        id: relock
        if: steps.compare.outputs.updated != '0'
        shell: bash
        run: |
          set -euo pipefail
          echo "regenerated=0" >> "$GITHUB_OUTPUT"
          cat <(cut -f1 "$RUNNER_TEMP/to-update.txt") "$RUNNER_TEMP/merged.txt" | grep -qx 'package.json' || {
            echo "package.json unchanged; lock left alone."
            exit 0
          }
          # Must be present AND tracked AND not gitignored: the PR step stages
          # with a plain `git add`, which refuses an ignored path. A mirror that
          # deliberately excludes its lock gets told, not broken.
          if [ ! -f package-lock.json ]; then
            echo "No lock in this mirror; nothing to regenerate."; exit 0
          fi
          if git check-ignore -q --no-index -- package-lock.json 2>/dev/null ||
             ! git ls-files --error-unmatch -- package-lock.json >/dev/null 2>&1; then
            echo "::warning::package-lock.json is untracked or gitignored here; leaving it alone. It may now disagree with package.json."
            exit 0
          fi

          BEFORE=$(jq -r '.lockfileVersion' package-lock.json)
          # A Raycast extension may depend on a package limited to macOS/Windows
          # ("os": ["darwin", "win32"]), and npm refuses it on this Linux runner
          # with EBADPLATFORM even for a lock-only resolve; `--os=darwin` does not
          # reach that check (npm 10.8 and 11.19). npm checks the platform only
          # after the tree has resolved, so a peer conflict (ERESOLVE) would already
          # have failed the first run. The same per-package loop also checks
          # `engines`, and --force skips that too; with npm's default
          # engine-strict=false an engine mismatch is only a warning, so the retry
          # loses nothing, but with engine-strict on it would hide a rejection, so
          # the step refuses instead. Verified 2026-11-19: the --force lock on
          # node:20 was byte-identical to the one macOS writes without it.
          LOCK_ARGS="--package-lock-only --ignore-scripts --no-audit --no-fund"
          if ! npm install $LOCK_ARGS 2> "$RUNNER_TEMP/npm-lock.err"; then
            cat "$RUNNER_TEMP/npm-lock.err" >&2
            if grep -q 'EBADPLATFORM' "$RUNNER_TEMP/npm-lock.err"; then
              if [ "$(npm config get engine-strict)" = "true" ]; then
                echo "::error::A dependency is not installable on Linux, and engine-strict is on, so --force would also skip the engines check. Relock on macOS and push the lockfile."
                exit 1
              fi
              echo "::notice::A dependency is not installable on Linux; re-resolving the lock with --force to skip the platform check (engine-strict is off, so engines were only warnings)."
              npm install $LOCK_ARGS --force
            else
              exit 1
            fi
          fi
          AFTER=$(jq -r '.lockfileVersion' package-lock.json)

          # `ubuntu-latest` floats, so the npm here floats with it. An image bump
          # that changes the lockfile format would rewrite the whole file inside a
          # content PR as if upstream had done it. Refuse: a loud stop is
          # recoverable, a silent whole-file rewrite reviewed as a sync is not.
          if [ "$BEFORE" != "$AFTER" ]; then
            git checkout -- package-lock.json
            echo "::error::npm rewrote lockfileVersion $BEFORE -> $AFTER. Refusing to bury a format migration in a sync PR — regenerate it locally and commit it yourself."
            exit 1
          fi

          if git diff --quiet -- package-lock.json; then
            echo "Lock already consistent with the new package.json."
            exit 0
          fi
          # Deliberately NOT appended to to-update.txt: that file means "taken
          # from upstream" and its count is already fixed. This lock was
          # GENERATED here; it is staged and described separately.
          echo "regenerated=1" >> "$GITHUB_OUTPUT"
          echo "  regenerated: package-lock.json"

      # UNCONDITIONAL on purpose. Gating this on `updated != '0'` freezes the
      # baseline — the runs that copy nothing are the common case — and the
      # next genuine upstream-only change then reads as "both sides moved" and
      # halts on a phantom conflict (history: 2026-08-13).
      - name: Record the new baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$STATE_FILE")"
          # Records what upstream serves NOW, so the next run can tell "upstream
          # changed it" from "I changed it". Without this the compare has no
          # third point and degrades to blind overwrite.
          jq -Rn --arg commit "${{ steps.compare.outputs.commit }}" \
                 --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                 --rawfile tsv "$RUNNER_TEMP/upstream.tsv" '
            {
              upstream_commit: $commit,
              synced_at: $ts,
              files: ($tsv | rtrimstr("\n") | split("\n")
                       | map(select(length > 0) | split("\t") | {(.[0]): .[1]})
                       | add // {})
            }' > "$RUNNER_TEMP/state.new"

          # `synced_at` changes on EVERY run; compare only the parts that carry
          # meaning, and keep the committed file when they match so an
          # unconditional write does not become a junk commit per run.
          if git show "HEAD:$STATE_FILE" > "$RUNNER_TEMP/state.old" 2>/dev/null &&
             [ "$(jq -S '{upstream_commit, files}' "$RUNNER_TEMP/state.old")" = \
               "$(jq -S '{upstream_commit, files}' "$RUNNER_TEMP/state.new")" ]; then
            cp "$RUNNER_TEMP/state.old" "$STATE_FILE"
            echo "baseline already current ($(jq '.files | length' "$STATE_FILE") files); timestamp left untouched"
          else
            cp "$RUNNER_TEMP/state.new" "$STATE_FILE"
            echo "recorded $(jq '.files | length' "$STATE_FILE") files"
          fi

      # THE ONE DIRECT WRITE TO MAIN (see the header). When files WERE copied,
      # the PR step stages the baseline alongside them, so this commit happens
      # only when there is no PR to ride on. Restricted to the default branch:
      # workflow_dispatch can be fired against any ref, and the baseline only
      # ever describes the mirror's mainline.
      - name: Commit the refreshed baseline when no PR will carry it
        if: >-
          steps.compare.outputs.updated == '0' &&
          steps.compare.outputs.deleted == '0' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          set -euo pipefail
          # status, not diff: on a mirror's first run the state file is untracked,
          # and `git diff` never sees untracked files.
          if [ -z "$(git status --porcelain -- "$STATE_FILE")" ]; then
            echo "Baseline already current; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage ONLY the bookkeeping file. No extension source moves here.
          git add -- "$STATE_FILE"
          git commit -m "chore: record upstream sync baseline ${{ steps.compare.outputs.commit }}"
          # A rejected push (main moved mid-run) fails the job on purpose — the
          # next scheduled run recomputes and retries. Swallowing it would
          # recreate the silent staleness this step exists to prevent.
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Open a pull request
        if: >-
          steps.compare.outputs.updated != '0' ||
          steps.compare.outputs.deleted != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ONLY what this run touched. `git add -A` would sweep in
          # anything else present in the tree.
          if [ -s "$RUNNER_TEMP/to-update.txt" ]; then
            cut -f1 "$RUNNER_TEMP/to-update.txt" | tr '\n' '\0' | xargs -0 git add --
          fi
          if [ -s "$RUNNER_TEMP/merged.txt" ]; then
            tr '\n' '\0' < "$RUNNER_TEMP/merged.txt" | xargs -0 git add --
          fi
          # Propagate the upstream deletions computed in the compare step. They
          # ride the PR like every other content change — nothing removes a
          # tracked file from main without a review.
          if [ -s "$RUNNER_TEMP/to-delete.txt" ]; then
            tr '\n' '\0' < "$RUNNER_TEMP/to-delete.txt" | xargs -0 git rm -q --
          fi
          if [ "${{ steps.relock.outputs.regenerated }}" = "1" ]; then
            git add -- package-lock.json
          fi
          git add -- "$STATE_FILE"

          if git diff --cached --quiet; then
            echo "Nothing staged; no PR needed."
            exit 0
          fi

          BRANCH="sync/upstream-${{ steps.compare.outputs.commit }}"
          BRANCH="${BRANCH:0:60}"

          # -- reuse-verification begin --
          # Reuse an existing branch, or its open PR, ONLY when it holds exactly
          # this run's result. The staged index IS this run's reconciliation;
          # write it as a tree object and compare trees. A branch left by an
          # earlier run (a refused `gh pr create`, say) may predate a local fix
          # or a newer upstream commit, and a PR opened from it would discard the
          # result just computed. Every lookup failure aborts: an API blip must
          # never read as "no branch" or "no open PR". Never `--force`: a
          # closed-but-undeleted PR or a manual fix-up commit on the branch
          # would be overwritten. (history: 2026-08-27 and the 2026-10-30 audit)
          set +e
          REMOTE_REF=$(git ls-remote --heads origin "refs/heads/$BRANCH")
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not list origin's branches (git ls-remote exit $rc); refusing to guess whether $BRANCH exists."
            exit 1
          fi
          REMOTE_SHA="${REMOTE_REF%%[[:space:]]*}"

          set +e
          OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not list open pull requests for $BRANCH (gh exit $rc); refusing to guess."
            exit 1
          fi

          if [ -n "$REMOTE_SHA" ]; then
            git fetch --quiet origin "refs/heads/$BRANCH" || { echo "::error::Could not fetch origin/$BRANCH."; exit 1; }
            # The baseline's `synced_at` is fresh on every run, so a retry would
            # never match the branch byte for byte. When the branch's baseline
            # agrees on everything that carries meaning ({upstream_commit, files}),
            # take its bytes (timestamp included) so the tree compare below is
            # exact; every other path is still compared exactly.
            if git cat-file -e "$REMOTE_SHA:$STATE_FILE" 2>/dev/null; then
              git show "$REMOTE_SHA:$STATE_FILE" > "$RUNNER_TEMP/state.branch"
              if [ "$(jq -S '{upstream_commit, files}' "$RUNNER_TEMP/state.branch")" = \
                   "$(jq -S '{upstream_commit, files}' "$STATE_FILE")" ]; then
                cp "$RUNNER_TEMP/state.branch" "$STATE_FILE"
                git add -- "$STATE_FILE"
              fi
            fi
            COMPUTED_TREE=$(git write-tree)
            REMOTE_TREE=$(git rev-parse --verify "$REMOTE_SHA^{tree}") || { echo "::error::Could not read the tree of origin/$BRANCH ($REMOTE_SHA)."; exit 1; }
            if [ "$REMOTE_TREE" != "$COMPUTED_TREE" ]; then
              echo "::error::Branch $BRANCH exists on origin (tree $REMOTE_TREE) but does not contain this run's reconciliation (tree $COMPUTED_TREE)${OPEN_PR:+; PR #$OPEN_PR is stale}. Not reusing it and not overwriting it: merge or delete the branch, then re-run."
              exit 1
            fi
            if [ -n "$OPEN_PR" ]; then
              echo "PR #$OPEN_PR is already open for $BRANCH and holds this run's result."
              exit 0
            fi
            echo "Branch $BRANCH already pushed and current; creating its missing PR."
          else
            if [ -n "$OPEN_PR" ]; then
              echo "::error::PR #$OPEN_PR is open for $BRANCH but origin has no such branch; refusing to continue."
              exit 1
            fi
            git switch -c "$BRANCH"
            git commit -m "chore: sync from upstream raycast/extensions"
            git push -u origin "$BRANCH"
          fi
          # -- reuse-verification end --

          KEPT_NOTE=""
          if [ "${{ steps.compare.outputs.kept }}" != "0" ]; then
            KEPT_NOTE=$(printf '\n### Local edits preserved\n\nThese differ from upstream because they were changed **here**. This PR leaves them alone:\n\n%s\n' \
              "$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/kept-local.txt")")
          fi

          DEL_NOTE=""
          if [ -s "$RUNNER_TEMP/to-delete.txt" ]; then
            DEL_NOTE=$(printf '\n### Removed (upstream no longer serves them)\n\n%s\n' \
              "$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/to-delete.txt")")
          fi
          if [ -s "$RUNNER_TEMP/deleted-upstream-kept.txt" ]; then
            DEL_KEPT=$(printf '\n### Removed upstream, but KEPT here\n\nUpstream dropped these and they were also changed in this mirror, so they were left alone and are now local-only:\n\n%s\n' \
              "$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/deleted-upstream-kept.txt")")
            DEL_NOTE="${DEL_NOTE}${DEL_KEPT}"
          fi

          LOCK_NOTE=""
          if [ "${{ steps.relock.outputs.regenerated }}" = "1" ]; then
            LOCK_NOTE=$(printf '\n### Regenerated here (not taken from upstream)\n\n- `package-lock.json` — re-resolved from the new `package.json` with `npm install --package-lock-only`. The mirror lock is never compared against the monorepo copy; it carries devDependencies upstream does not.\n')
          fi

          MERGED_NOTE=""
          if [ -s "$RUNNER_TEMP/merged.txt" ]; then
            MERGED_NOTE=$(printf '\n### Merged: both sides changed (review these closely)\n\nEach file combines this mirror'"'"'s edits with upstream'"'"'s, by a 3-way merge against the last synced baseline. No hunks overlapped, but a clean merge is not proof the result is right:\n\n%s\n' \
              "$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/merged.txt")")
          fi

          PR_REF=""
          if [ -n "${{ github.event.client_payload.pr_number }}" ]; then
            PR_REF=$(printf '\nTriggered by raycast/extensions#%s.' "${{ github.event.client_payload.pr_number }}")
          fi

          # Only when something was taken: a merge-only PR would otherwise open
          # with "Files taken from upstream (0)" and read as carrying nothing.
          TAKEN_NOTE=""
          if [ -s "$RUNNER_TEMP/to-update.txt" ]; then
            TAKEN_NOTE=$(printf '\n### Files taken from upstream (%s)\n\n%s\n' \
              "${{ steps.compare.outputs.taken }}" \
              "$(cut -f1 "$RUNNER_TEMP/to-update.txt" | sed 's/^/- `/; s/$/`/')")
          fi

          BODY=$(printf 'Brings this mirror up to date with the merged monorepo state.\n\nUpstream commit: [`%s`](https://github.com/raycast/extensions/commit/%s)%s\n%s%s%s\n---\n\nOpened automatically. Merging this PR is the only way extension content reaches `main` (the workflow writes only its own baseline file, `.github/upstream-sync-state.json`, there directly) — review the diff and merge when it looks right. If it contains someone else'"'"'s contribution, credit them in `CHANGELOG.md` before merging.\n' \
            "${{ steps.compare.outputs.commit }}" \
            "${{ steps.compare.outputs.commit }}" \
            "$PR_REF" \
            "$TAKEN_NOTE" \
            "${MERGED_NOTE}${DEL_NOTE}" \
            "${KEPT_NOTE}${LOCK_NOTE}")

          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "chore: sync from upstream raycast/extensions" --body "$BODY"

      - name: Report when nothing changed
        if: >-
          steps.compare.outputs.updated == '0' &&
          steps.compare.outputs.deleted == '0' &&
          steps.compare.outputs.conflicts == '0'
        run: |
          echo "Mirror is up to date with upstream."
          echo "Local-only edits preserved: ${{ steps.compare.outputs.kept }}"
